basePath: /
definitions:
  dto.CreatePinRequest:
    properties:
      confirm_new_pin:
        type: string
      new_pin:
        type: string
    required:
    - confirm_new_pin
    - new_pin
    type: object
  dto.CreateTopupRequest:
    properties:
      amount:
        type: number
      payment_method_id:
        type: integer
    required:
    - amount
    - payment_method_id
    type: object
  dto.CreateTransferRequest:
    properties:
      amount:
        type: number
      description:
        type: string
      pin:
        type: string
      receiver_id:
        type: integer
    required:
    - amount
    - pin
    - receiver_id
    type: object
  dto.EditPasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.EditPinRequest:
    properties:
      confirm_new_pin:
        type: string
      current_pin:
        type: string
      new_pin:
        type: string
    required:
    - confirm_new_pin
    - current_pin
    - new_pin
    type: object
  dto.FindReceiverDTO:
    properties:
      full_name:
        type: string
      id:
        type: integer
      is_verified:
        type: boolean
      phone:
        type: string
      profile_picture_url:
        type: string
    type: object
  dto.ForgotPasswordDTO:
    properties:
      expired_at:
        type: string
      token:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.GetTransactionHistoryDTO:
    properties:
      activity_type:
        type: string
      amount:
        type: number
      phone:
        type: string
      profile_picture_url:
        type: string
      receiver_name:
        type: string
      status:
        type: string
      transaction_id:
        type: integer
      type:
        type: string
    type: object
  dto.GetTransactionReportDTO:
    properties:
      period:
        type: string
      total_expense:
        type: number
      total_income:
        type: number
    type: object
  dto.GetTransactionReportResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.GetTransactionReportDTO'
        type: array
      period:
        type: string
      summary:
        $ref: '#/definitions/dto.ReportSummaryDTO'
    type: object
  dto.GetUserDashboardDTO:
    properties:
      balance:
        type: number
      total_expenses:
        type: number
      total_income:
        type: number
    type: object
  dto.GetUserProfileDTO:
    properties:
      email:
        example: example@mail.com
        type: string
      full_name:
        example: John Doe
        type: string
      id:
        example: 1
        type: integer
      phone:
        example: "021234512552"
        type: string
      profile_picture_url:
        example: https://example.com
        type: string
    type: object
  dto.LoginDTO:
    properties:
      full_name:
        example: John Doe
        type: string
      has_pin:
        example: true
        type: boolean
      token:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: example@mail.com
        type: string
      password:
        example: example123
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      data:
        $ref: '#/definitions/dto.LoginDTO'
      message:
        example: Welcome, John doe
        type: string
      status:
        example: success
        type: string
    type: object
  dto.PaginationMetaData:
    properties:
      next_page:
        type: string
      page_size:
        type: integer
      prev_page:
        type: string
      total-page:
        type: integer
      total_data:
        type: integer
    type: object
  dto.RegisterDTO:
    properties:
      created-at:
        example: "2026-05-19T23:35:11.88652Z"
        type: string
      email:
        example: example@mail.com
        type: string
      full_name:
        example: John Doe
        type: string
      id:
        example: 101
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      confirm_password:
        example: example123
        type: string
      email:
        example: example@mail.com
        type: string
      full_name:
        example: John Doe
        minLength: 3
        type: string
      password:
        example: example123
        minLength: 8
        type: string
    required:
    - confirm_password
    - email
    - full_name
    - password
    type: object
  dto.RegisterResponse:
    properties:
      data:
        $ref: '#/definitions/dto.RegisterDTO'
      message:
        example: Welcome, John doe
        type: string
      status:
        example: success
        type: string
    type: object
  dto.ReportSummaryDTO:
    properties:
      net_amount:
        type: number
      total-expense:
        type: number
      total-income:
        type: number
    type: object
  dto.ResetPasswordRequest:
    properties:
      confirm_password:
        type: string
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - confirm_password
    - new_password
    - token
    type: object
  dto.ResponseError:
    properties:
      error:
        example: internal server error/bad request
        type: string
      message:
        example: Failed get data/internal server error
        type: string
      status:
        example: error
        type: string
    type: object
  dto.ResponseSuccess:
    properties:
      message:
        example: Welcome, John doe
        type: string
      status:
        example: success
        type: string
    type: object
  dto.TopupDetailDTO:
    properties:
      fee:
        type: number
      new_balance:
        type: number
      order_amount:
        type: number
      payment_method:
        type: string
      tax_amount:
        type: number
      total_amount:
        type: number
      transaction_id:
        type: integer
    type: object
host: localhost:80/api
info:
  contact:
    email: limustadji@gmail.com
    name: Ali Mustadji
    url: https://github.com/L1mus
  description: This is a backend project for a web application called E-wallet.
  license:
    name: MIT
  title: E-Wallet API
  version: "1.0"
paths:
  /auth:
    post:
      consumes:
      - application/json
      description: login into user account
      parameters:
      - description: Login Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Email or pass wrong || binding error
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Login account
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset token. In production this would be sent
        via email. Token is valid for 1 hour.
      parameters:
      - description: Forgot Password Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/dto.ForgotPasswordDTO'
              type: object
        "400":
          description: invalid email format
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Forgot password
      tags:
      - Auth
  /auth/logout:
    post:
      description: Blacklist current active session token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - BearerAuth: []
      summary: Logout account
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: create user account
      parameters:
      - description: Register Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: required field || invalid format || email already exist
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Register account
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using a valid token from forgot-password endpoint.
        Token can only be used once and expires in 1 hour.
      parameters:
      - description: Reset Password Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Validate Binding GIN
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: token not found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "422":
          description: token used | token expired
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      summary: Reset password
      tags:
      - Auth
  /transactions/topup:
    post:
      consumes:
      - application/json
      description: Top up wallet balance. Fee is charged based on payment method +
        10% tax from order amount.
      parameters:
      - description: Topup Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTopupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/dto.TopupDetailDTO'
              type: object
        "400":
          description: payment method not found | not active | validation error
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - ApiKeyAuth: []
      summary: Create topup
      tags:
      - transactions
  /transactions/transfer:
    post:
      consumes:
      - application/json
      description: Transfer funds to another user. Requires a PIN for confirmation.
        The sender's wallet balance decreases and the recipient's wallet balance increases
        atomically (DB transaction). Transfers to oneself are not permitted.
      parameters:
      - description: Transfer Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTransferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: wrong pin | insufficient balance | receiver not found | self
            transfer | validation error
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - ApiKeyAuth: []
      summary: Create money transfer
      tags:
      - transactions
  /users/dashboard:
    get:
      consumes:
      - application/json
      description: Get authenticated user's wallet balance, total income, and total
        expenses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/dto.GetUserDashboardDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: Get user dashboard
      tags:
      - users
  /users/password:
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's login password. Requires the current
        password to be provided
      parameters:
      - description: Edit Password Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.EditPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Wrong Password
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: Edit user password
      tags:
      - users
  /users/pin:
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's transaction PIN. Requires the current
        PIN to be provided
      parameters:
      - description: Edit PIN Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.EditPinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Wrong PIN or Empty PIN
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: Edit user PIN
      tags:
      - users
  /users/pin/set:
    post:
      consumes:
      - application/json
      description: Create a new transaction PIN. Only works if user does not have
        a PIN yet.
      parameters:
      - description: Create PIN Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: PIN already Create use change pin instead
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: create PIN for first time
      tags:
      - users
  /users/profile:
    get:
      consumes:
      - application/json
      description: Get authenticated user's profile details
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/dto.GetUserProfileDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: Get user Profile
      tags:
      - users
    patch:
      consumes:
      - multipart/form-data
      description: Update full name, phone number, and avatar image simultaneously
        using multipart/form-data
      parameters:
      - description: Full Name
        in: formData
        name: full_name
        type: string
      - description: Phone Number
        in: formData
        name: phone
        type: string
      - description: Avatar profile image (jpg, png, max 2MB)
        in: formData
        name: picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSuccess'
        "400":
          description: Bad Request / Invalid Format
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "409":
          description: Phone Number Already Exists
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "422":
          description: File to large || File type not allowed
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: Update User Profile
      tags:
      - users
  /users/report:
    get:
      consumes:
      - application/json
      description: Get aggregated income and expense report for the authenticated
        user, grouped by the selected time period
      parameters:
      - description: Time period to group by
        enum:
        - week
        - month
        - year
        example: '"month"'
        in: query
        name: period
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseSuccess'
            - properties:
                data:
                  $ref: '#/definitions/dto.GetTransactionReportResponse'
              type: object
        "400":
          description: Bad Request / Invalid Period
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: Get transaction report
      tags:
      - users
  /users/transactions:
    get:
      consumes:
      - application/json
      description: Get a paginated list of the authenticated user's transaction history,
        optionally filtered by a search keyword
      parameters:
      - description: Search by receiver name, payment method, or description
        example: '"John Doe"'
        in: query
        name: search
        type: string
      - description: Page number
        example: '"1"'
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseSuccess'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.GetTransactionHistoryDTO'
                  type: array
                meta:
                  $ref: '#/definitions/dto.PaginationMetaData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: Get transaction history
      tags:
      - users
  /users/transfer:
    get:
      consumes:
      - application/json
      description: Search for other users to be used as a transfer recipient, with
        pagination
      parameters:
      - description: Search by name or phone number
        example: '"John Doe"'
        in: query
        name: search
        type: string
      - description: Page number
        example: '"1"'
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseSuccess'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.FindReceiverDTO'
                  type: array
                meta:
                  $ref: '#/definitions/dto.PaginationMetaData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseError'
      security:
      - APIKeyAuth: []
      summary: Find transfer receiver
      tags:
      - users
securityDefinitions:
  ApiKeyAuth:
    description: Bearer token used for authorization
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
